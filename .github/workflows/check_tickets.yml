name: Ticket Page Checker

on:
  schedule:
    - cron: '*/5 * * * *' # Trigger every 5 minutes
  workflow_dispatch:      # Allows manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          pip install requests playwright
          playwright install chromium

      - name: Run script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          NTFY_CHANNEL: ${{ secrets.NTFY_CHANNEL }}
        run: python bot.py

      - name: Save state changes back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ticket_state.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ticket state" && git push)
